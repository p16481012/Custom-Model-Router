<section id="cmr_settings" class="cmr-panel" aria-labelledby="cmr_panel_title">
    <header class="cmr-panel-header">
        <div class="cmr-panel-heading">
            <h2 id="cmr_panel_title">사용자 지정 Vertex 모델</h2>
            <span class="cmr-product-name">Custom Model Router</span>
        </div>
        <span class="cmr-version">v0.1.2</span>
    </header>

    <p class="cmr-description">
        기존 Google Vertex AI 연결은 그대로 두고, 현재 Gemini 요청 규격과 호환되는 모델 ID를 추가합니다.
    </p>

    <div id="cmr_compatibility" class="cmr-status" role="status" aria-live="polite" aria-atomic="true"></div>

    <form id="cmr_add_form" class="cmr-add-form">
        <label for="cmr_model_id">Vertex Gemini 모델 ID</label>
        <div class="cmr-input-row">
            <input
                id="cmr_model_id"
                class="text_pole flex1"
                type="text"
                maxlength="128"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                placeholder="gemini-x.y-pro-preview"
                aria-describedby="cmr_model_help cmr_feedback"
                autofocus
                required
            >
            <button class="menu_button menu_button_icon" type="submit">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                <span>추가</span>
            </button>
        </div>
        <small id="cmr_model_help"><code>gemini-</code>로 시작하며 영문 소문자, 숫자, 마침표, 밑줄, 하이픈만 허용합니다.</small>
    </form>

    <div id="cmr_feedback" class="cmr-feedback" role="status" aria-live="polite" aria-atomic="true"></div>

    <section class="cmr-list-region" aria-labelledby="cmr_list_title">
        <div class="cmr-list-header">
            <h3 id="cmr_list_title">등록한 모델</h3>
            <span id="cmr_model_count" class="cmr-list-count">0개</span>
        </div>
        <ul id="cmr_model_list" class="cmr-model-list"></ul>
    </section>

    <details class="cmr-scope-note">
        <summary>지원 범위 및 개인정보</summary>
        <p>v0.1은 Vertex Gemini 텍스트 모델만 지원합니다. API 키, Service Account, 프로젝트 ID, 리전은 읽거나 저장하지 않습니다.</p>
    </details>
</section>
