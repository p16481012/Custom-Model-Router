name: UI 회귀 검사

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-layout:
    name: SillyTavern 1.18.0 · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: custom-model-router
    env:
      SILLYTAVERN_ROOT: ${{ github.workspace }}/sillytavern-1.18.0

    steps:
      - name: 확장 소스 체크아웃
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: custom-model-router
          persist-credentials: false

      - name: SillyTavern 1.18.0 체크아웃
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: SillyTavern/SillyTavern
          ref: 51ad27fb86d39a3daca3adaa970375c9670c12df
          path: sillytavern-1.18.0
          persist-credentials: false

      - name: Node.js 준비
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: custom-model-router/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 정적·단위 검사
        run: npm run check

      - name: 실제 UI 회귀 검사
        run: npm run test:ui

      - name: 화면 증거와 실패 추적 파일 보관
        if: always() && !cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-regression-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            custom-model-router/test-results
            custom-model-router/playwright-report
          if-no-files-found: ignore
          retention-days: 14
