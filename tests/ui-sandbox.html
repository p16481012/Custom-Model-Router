<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom Model Router UI 샌드박스</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --SmartThemeBodyColor: #f7f7f8;
            --SmartThemeBorderColor: #767676;
            --SmartThemeQuoteColor: #356ac3;
            --success-color: #2f9e44;
            --golden: #d99b12;
            --warning-color: #d64c4c;
            color: #202124;
            color-scheme: light;
            font: 16px/1.4 system-ui, sans-serif;
        }

        body {
            background: #dadde3;
            margin: 0;
            padding: 1rem;
        }

        .sandbox-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0 auto 1rem;
            max-width: 52rem;
        }

        .preview-shell {
            background: var(--SmartThemeBodyColor);
            border: 1px solid #555;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1.5rem #0003;
            margin-inline: auto;
            max-height: calc(100vh - 5rem);
            overflow: auto;
            padding: 1rem;
            width: 360px;
        }

        /* SillyTavern의 전역 버튼 너비를 재현한다. CMR CSS가 이를 안전하게 덮어써야 한다. */
        .menu_button {
            align-items: center;
            border: 1px solid #555;
            border-radius: 0.25rem;
            color: inherit;
            display: flex;
            justify-content: center;
            min-height: 2.3rem;
            padding: 0.35rem 0.55rem;
            width: min-content;
        }

        .text_pole {
            background: #fff;
            border: 1px solid #777;
            border-radius: 0.25rem;
            color: #202124;
            min-height: 2.5rem;
            padding: 0.35rem 0.5rem;
        }

        .wide100p {
            width: 100%;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="sandbox-toolbar" aria-label="미리보기 폭">
        <button type="button" data-width="260">260px</button>
        <button type="button" data-width="320">320px</button>
        <button type="button" data-width="360">360px</button>
        <button type="button" data-width="420">420px</button>
        <button type="button" data-width="720">720px</button>
    </nav>
    <main id="preview" class="preview-shell" aria-label="Custom Model Router 관리 패널 미리보기"></main>

    <script type="module">
        const preview = document.querySelector('#preview');
        preview.innerHTML = await fetch('../settings.html').then(response => response.text());

        const addOptions = (select, labels) => {
            for (const label of labels) {
                const option = document.createElement('option');
                option.textContent = label;
                option.value = label;
                select.append(option);
            }
        };

        addOptions(document.querySelector('#cmr_provider'), ['Google Vertex AI', 'Z.AI (GLM)', 'OpenRouter']);
        addOptions(document.querySelector('#cmr_route_purpose'), ['번역', '요약']);
        addOptions(document.querySelector('#cmr_route_model'), ['vertexai / gemini-3.1-pro-preview']);
        addOptions(document.querySelector('#cmr_route_profile'), ['Vertex 보조 연결']);
        document.querySelector('#cmr_compatibility').dataset.state = 'ok';
        document.querySelector('#cmr_compatibility').textContent = '모델 선택기를 찾았습니다.';

        const modelList = document.querySelector('#cmr_model_list');
        for (const [id, current] of [
            ['gemini-3.1-pro-preview', true],
            ['gemini-3.7-flash', false],
        ]) {
            const row = document.createElement('li');
            row.className = 'cmr-model-row';
            row.dataset.current = String(current);
            row.innerHTML = `<div class="cmr-model-summary"><span class="cmr-model-id">${id}</span></div><div class="cmr-model-actions"><button class="menu_button cmr-icon-button" type="button" aria-label="${id} 선택">✓</button><button class="menu_button cmr-icon-button" type="button" aria-label="${id} 삭제">×</button></div>`;
            modelList.append(row);
        }
        document.querySelector('#cmr_model_count').textContent = '이 제공업체 2개 · 전체 2개';

        const createExternalRow = ({ name, status, detail, explanation, mode = '' }) => {
            const row = document.createElement('li');
            row.className = 'cmr-external-row';
            row.dataset.needsAttention = String(status === '설정 필요');
            const details = document.createElement('details');
            details.className = 'cmr-external-details';
            details.open = status === '설정 필요';
            details.innerHTML = `
                <summary>
                    <div class="cmr-external-heading"><span class="cmr-external-name">${name}</span></div>
                    <span class="cmr-badge">${status}</span>
                    <span class="cmr-external-summary-detail">${detail}</span>
                </summary>
                <div class="cmr-external-body">
                    <p class="cmr-external-explanation">${explanation}</p>
                    <div class="cmr-external-mode-field">
                        <label>연결 방식</label>
                        <select class="text_pole" data-cmr-external-mode="true">
                            ${status === '설정 필요' ? '<option value="__choose_provider__" disabled>제공업체를 선택하세요</option>' : ''}
                            <option value="">${status === '설정 필요' ? '자동 감지 다시 시도' : '자동으로 찾기 (권장)'}</option>
                            <optgroup label="제공업체 직접 지정">
                                <option value="vertexai">Google Vertex AI</option>
                                <option value="zai">Z.AI (GLM)</option>
                            </optgroup>
                            <option value="disabled">이 입력란에서는 연결 안 함</option>
                        </select>
                    </div>
                    <details class="cmr-external-technical"><summary>문제 해결용 정보</summary><div class="cmr-external-technical-body"><span>기술 식별자</span><code class="cmr-external-hint">#caption_multimodal_model</code></div></details>
                </div>`;
            details.querySelector('select').value = status === '설정 필요' && !mode ? '__choose_provider__' : mode;
            row.append(details);
            return row;
        };

        document.querySelector('#cmr_external_list').append(
            createExternalRow({
                name: 'Caption · 이미지 설명 모델',
                status: '사용 가능',
                detail: 'Google Vertex AI · 자동으로 연결됨',
                explanation: 'CMR이 Google Vertex AI 연결을 찾았습니다. 등록 모델을 이 입력란에 표시합니다.',
            }),
            createExternalRow({
                name: '요약 · 모델 입력란',
                status: '설정 필요',
                detail: '제공업체를 확인하지 못함',
                explanation: '아래 연결 방식에서 사용할 제공업체를 직접 선택하세요.',
            }),
        );
        document.querySelector('#cmr_external_count').textContent = '사용 가능 1개 · 설정 필요 1개';
        document.querySelector('#cmr_external_skipped').textContent = '지원하지 않는 입력란 3개는 안전을 위해 건드리지 않았습니다.';
        document.querySelectorAll('.cmr-tool-section').forEach(section => {
            section.open = true;
        });

        function setWidth(width) {
            preview.style.width = `${width}px`;
        }

        function getMetrics() {
            const routeButtons = [...document.querySelectorAll('.cmr-route-actions .menu_button')];
            const operationButtons = [...document.querySelectorAll('.cmr-operation-actions .menu_button')];
            return {
                width: preview.getBoundingClientRect().width,
                overflow: preview.scrollWidth > preview.clientWidth,
                routeTops: routeButtons.map(button => Math.round(button.getBoundingClientRect().top)),
                routeWidths: routeButtons.map(button => Math.round(button.getBoundingClientRect().width)),
                operationTops: operationButtons.map(button => Math.round(button.getBoundingClientRect().top)),
                operationWidths: operationButtons.map(button => Math.round(button.getBoundingClientRect().width)),
                operationHeights: operationButtons.map(button => Math.round(button.getBoundingClientRect().height)),
                operationWhiteSpace: operationButtons.map(button => getComputedStyle(button).whiteSpace),
                routeOverflows: routeButtons.map(button => button.scrollWidth > button.clientWidth),
                operationOverflows: operationButtons.map(button => button.scrollWidth > button.clientWidth),
                cardPadding: getComputedStyle(document.querySelector('.cmr-primary-section')).padding,
            };
        }

        document.querySelector('.sandbox-toolbar').addEventListener('click', event => {
            const width = Number(event.target.dataset.width);
            if (width) {
                setWidth(width);
            }
        });
        globalThis.cmrUiSandbox = { getMetrics, setWidth };
    </script>
</body>
</html>
